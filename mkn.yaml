#! clean build -dtOa -fPIC -p all

name: mkn.gl
property:
  # dependency versions: master on master, latest on latest (a bare dep is the default branch)
  mkn.kul.version: master
parent: all

profile:
- name: inc
  inc: inc

- name: all
  dep: mkn.kul#${mkn.kul.version}
  parent: inc
  if_arg:
    bsd: -DMACOSX
    nix: -D_GLFW_X11 -D_GLFW_GLX -D_GLFW_HAS_DLOPEN
    win: -D_GLFW_WIN32 -D_GLFW_WGL
    win_shared: -D_GLFW_BUILD_DLL -DGLEW_BUILD -DGLEWAPI
    win_static: -DGLEW_STATIC
  arg: -D_GLFW_USE_OPENGL=1
  src:
    dep/glfw/g/src
    dep/glew/g/src/glew.c
  lib: GL

# first person camera over a cube, see ex/
- name: example
  parent: all
  inc: ex
  main: ex/cube.cpp

- name: dep_get
  dep:
    gl.gl&dep/gl
    gl.glu&dep/glu
    gl.glew&dep/glew
    gl.glfw&dep/glfw
    gl.glm&dep/glm
    gl.gli&dep/gli
