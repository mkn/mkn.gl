
name: Ubuntu

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:

env:
  CURL_GET: curl -fL --retry 3 --retry-delay 2
  PATH_GET: https://github.com/mkn/mkn/releases/download/latest

jobs:
  build:
    name: Ubuntu
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - run: |
        sudo apt update && sudo apt install -y libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev
        $CURL_GET -o mkn ${PATH_GET}/mkn_nix
        chmod +x mkn
        PATH="$PWD:$PATH" ./mkn.sh
        ./mkn clean build -dtOa -fPIC -p all
